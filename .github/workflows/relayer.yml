name: relayer
# One reconcile pass every 5 minutes: Base Locked -> Arc bridgeIn,
# Arc BridgedOut -> Base release. Safety lives ON-CHAIN (idempotent per
# ticket, hard mint cap) — this schedule sets latency, not risk. The
# always-on 30s-poll worker is the mainnet-grade upgrade; same script.

on:
  # schedules removed 2026-09-10: GitHub cron drift breached the 2h staleness
  # bound; both daemons now run in the always-on Cloud Run service. These
  # workflows remain as manual backup buttons (workflow_dispatch) only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relayer
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # scan checkpoint survives between runs (immutable keys; newest wins)
      - uses: actions/cache/restore@v4
        with:
          path: scripts/relayer-checkpoint.json
          key: relayer-checkpoint-${{ github.run_id }}
          restore-keys: relayer-checkpoint-
      - run: npm install --no-fund --no-audit ethers
        working-directory: scripts
      - run: node relayer.mjs --once
        working-directory: scripts
        env:
          BASE_RPC: https://mainnet.base.org
          ARC_RPC: https://rpc.testnet.arc.network
          BASE_LOCKER: "0x96D213E6d0fc3925F557d50D0d49e2Cd90a44E57"
          WNEWS_BRIDGE: "0x96D213E6d0fc3925F557d50D0d49e2Cd90a44E57"
          START_BLOCK_BASE: "51023850"
          START_BLOCK_ARC: "61010900"
          RELAYER_PK: ${{ secrets.RELAYER_PK }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: scripts/relayer-checkpoint.json
          key: relayer-checkpoint-${{ github.run_id }}
